<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Orders - Celestial Grace Inventory</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <aside class="sidebar">
    <h2>Celestial Grace</h2>
    <p>Inventory</p>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/products" data-roles="ADMIN,STAFF">Products</a>
      <a href="/raw-materials" data-roles="ADMIN,STAFF">Raw Materials</a>
      <a href="/suppliers" data-roles="ADMIN">Suppliers</a>
      <a href="/purchase-orders" data-roles="ADMIN">Purchase Orders</a>
      <a href="/customers" data-roles="ADMIN,STAFF">Customers</a>
      <a href="/sales-orders" data-roles="ADMIN,STAFF">Sales Orders</a>
      <a href="/inventory" data-roles="ADMIN,STAFF">Inventory</a>
      <a href="/bom" data-roles="ADMIN">BOM</a>
      <a href="/import" data-roles="ADMIN">Import</a>
      <a href="/admin" data-roles="ADMIN">Admin</a>
    </nav>
    <div style="margin-top:auto; padding-top:16px; border-top:1px solid #e5e7eb;">
      <p style="font-size:13px; font-weight:500;" id="userName"></p>
      <p style="font-size:11px; color:#6b7280;" id="userRole"></p>
      <button class="btn" style="width:100%; margin-top:8px;" onclick="logout()">Logout</button>
    </div>
  </aside>
  <main class="main">
    <div class="top-bar"><h1>Sales Orders</h1><button class="btn btn-primary" onclick="openModal('soModal')">New Order</button></div>
    <div class="card"><table><thead><tr><th>Customer</th><th>Total</th><th>Status</th><th>Payment</th><th>Actions</th></tr></thead>
    <tbody id="soTable"><tr><td colspan="5" style="text-align:center;color:#6b7280;">Loading...</td></tr></tbody></table></div>
  </main>
  <div id="soModal" class="modal"><div class="modal-content">
    <h3>New Sales Order</h3>
    <form id="soForm">
      <label>Customer</label><select id="soCustomer" required></select>
      <label>Notes</label><textarea id="soNotes"></textarea>
      <h4 style="margin-top:16px;">Line Items</h4>
      <div id="soItems"></div>
      <button type="button" class="btn" style="margin-top:8px;" onclick="addSoItem()">Add Item</button>
      <div style="display:flex; gap:8px; margin-top:12px;"><button type="submit" class="btn btn-primary">Create</button><button type="button" class="btn" onclick="closeModal('soModal')">Cancel</button></div>
    </form>
  </div></div>
  <script src="/js/api.js"></script><script src="/js/app.js"></script>
  <script>
    let customers = [];
    let products = [];
    let soItems = [{ productId: "", variantId: "", quantity: 1, unitPrice: 0 }];

    async function loadSalesOrders() { const data = await api.get("/api/sales-orders"); const tbody = document.getElementById("soTable"); if (!data || data.length === 0) { tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#6b7280;">No orders</td></tr>'; return; } tbody.innerHTML = data.map(so => `<tr><td>${so.customer?.name || "-"}</td><td>$${Number(so.totalAmount).toFixed(2)}</td><td>${so.orderStatus}</td><td>${so.paymentStatus}</td><td><button class="btn" onclick="viewSO('${so.id}')">View</button></td></tr>`).join(""); }
    async function viewSO(id) { const so = await api.get(`/api/sales-orders/${id}`); alert(JSON.stringify(so, null, 2)); }

    async function openModal(id) {
      customers = await api.get("/api/customers");
      products = await api.get("/api/products");
      document.getElementById("soCustomer").innerHTML = customers.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
      soItems = [{ productId: "", variantId: "", quantity: 1, unitPrice: 0 }];
      renderSoItems();
      document.getElementById(id).classList.remove("hidden");
    }
    function renderSoItems() {
      const container = document.getElementById("soItems");
      container.innerHTML = soItems.map((item, idx) => `<div style="display:flex; gap:8px; margin-bottom:8px; align-items:center;">
        <select data-idx="${idx}" class="so-product" style="flex:2;"><option value="">Select product</option>${products.map(p => `<option value="${p.id}" ${item.productId === p.id ? "selected" : ""}>${p.name}</option>`).join("")}</select>
        <input type="number" placeholder="Qty" value="${item.quantity}" data-idx="${idx}" class="so-qty" style="flex:1;" />
        <input type="number" placeholder="Unit Price" value="${item.unitPrice}" data-idx="${idx}" class="so-price" style="flex:1;" />
        <button type="button" class="btn btn-danger" onclick="removeSoItem(${idx})">X</button>
      </div>`).join("");
    }
    function addSoItem() { soItems.push({ productId: "", variantId: "", quantity: 1, unitPrice: 0 }); renderSoItems(); }
    function removeSoItem(idx) { soItems.splice(idx, 1); renderSoItems(); }
    document.getElementById("soItems").addEventListener("input", (e) => { const idx = e.target.dataset.idx; if (idx === undefined) return; if (e.target.classList.contains("so-qty")) soItems[idx].quantity = Number(e.target.value); if (e.target.classList.contains("so-price")) soItems[idx].unitPrice = Number(e.target.value); });
    document.getElementById("soForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = { customerId: document.getElementById("soCustomer").value, items: soItems.filter(i => i.productId), notes: document.getElementById("soNotes").value, createdBy: window.appUser?.name || "unknown" };
      await api.post("/api/sales-orders", payload);
      showToast("Sales order created");
      closeModal("soModal");
      loadSalesOrders();
    });
    function closeModal(id) { document.getElementById(id).classList.add("hidden"); }
    initApp().then(loadSalesOrders);
  </script>
  <style>.modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; } .modal-content { background:#fff; padding:24px; border-radius:8px; width:100%; max-width:600px; } .modal-content label { display:block; font-size:13px; font-weight:500; margin-bottom:4px; margin-top:10px; } .modal-content input, .modal-content select, .modal-content textarea { margin-bottom:4px; }</style>
</body>
</html>
