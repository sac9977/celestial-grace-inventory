<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Celestial Grace Inventory</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <aside class="sidebar">
    <h2>Celestial Grace</h2>
    <p>Inventory</p>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/products" data-roles="ADMIN,STAFF">Products</a>
      <a href="/raw-materials" data-roles="ADMIN,STAFF">Raw Materials</a>
      <a href="/suppliers" data-roles="ADMIN">Suppliers</a>
      <a href="/purchase-orders" data-roles="ADMIN">Purchase Orders</a>
      <a href="/customers" data-roles="ADMIN,STAFF">Customers</a>
      <a href="/sales-orders" data-roles="ADMIN,STAFF">Sales Orders</a>
      <a href="/inventory" data-roles="ADMIN,STAFF">Inventory</a>
      <a href="/bom" data-roles="ADMIN">BOM</a>
      <a href="/import" data-roles="ADMIN">Import</a>
      <a href="/admin" data-roles="ADMIN">Admin</a>
    </nav>
    <div style="margin-top:auto; padding-top:16px; border-top:1px solid #e5e7eb;">
      <p style="font-size:13px; font-weight:500;" id="userName"></p>
      <p style="font-size:11px; color:#6b7280;" id="userRole"></p>
      <button class="btn" style="width:100%; margin-top:8px;" onclick="logout()">Logout</button>
    </div>
  </aside>
  <main class="main">
    <div class="top-bar">
      <h1>Products</h1>
      <button class="btn btn-primary" onclick="openModal('productModal')">Add Product</button>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>SKU</th><th>Name</th><th>Category</th><th>Cost</th><th>Price</th><th>Actions</th></tr></thead>
        <tbody id="productsTable"><tr><td colspan="6" style="text-align:center;color:#6b7280;">Loading...</td></tr></tbody>
      </table>
    </div>
  </main>

  <div id="productModal" class="modal">
    <div class="modal-content">
      <h3 id="productModalTitle">Add Product</h3>
      <form id="productForm">
        <input type="hidden" id="productId">
        <label>SKU</label><input id="productSku" required>
        <label>Name</label><input id="productName" required>
        <label>Description</label><textarea id="productDesc"></textarea>
        <label>Category</label><input id="productCategory" required>
        <label>Cost Price</label><input id="productCost" type="number" step="0.01" required>
        <label>Selling Price</label><input id="productPrice" type="number" step="0.01" required>
        <div style="display:flex; gap:8px; margin-top:12px;">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn" onclick="closeModal('productModal')">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    let editingProductId = null;

    async function loadProducts() {
      const data = await api.get("/api/products");
      const tbody = document.getElementById("productsTable");
      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#6b7280;">No products found</td></tr>';
        return;
      }
      tbody.innerHTML = data.map(p => `<tr>
        <td>${p.sku}</td><td>${p.name}</td><td>${p.category}</td><td>$${Number(p.costPrice).toFixed(2)}</td><td>$${Number(p.sellingPrice).toFixed(2)}</td>
        <td><button class="btn" onclick="editProduct('${p.id}')">Edit</button> <button class="btn btn-danger" onclick="deleteProduct('${p.id}')">Delete</button></td>
      </tr>`).join("");
    }

    document.getElementById("productForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        sku: document.getElementById("productSku").value,
        name: document.getElementById("productName").value,
        description: document.getElementById("productDesc").value,
        category: document.getElementById("productCategory").value,
        costPrice: document.getElementById("productCost").value,
        sellingPrice: document.getElementById("productPrice").value,
      };
      if (editingProductId) {
        await api.patch(`/api/products/${editingProductId}`, payload);
        showToast("Product updated");
      } else {
        await api.post("/api/products", payload);
        showToast("Product created");
      }
      closeModal("productModal");
      loadProducts();
    });

    async function editProduct(id) {
      const p = await api.get(`/api/products/${id}`);
      editingProductId = id;
      document.getElementById("productModalTitle").textContent = "Edit Product";
      document.getElementById("productSku").value = p.sku;
      document.getElementById("productName").value = p.name;
      document.getElementById("productDesc").value = p.description || "";
      document.getElementById("productCategory").value = p.category;
      document.getElementById("productCost").value = p.costPrice;
      document.getElementById("productPrice").value = p.sellingPrice;
      openModal("productModal");
    }

    async function deleteProduct(id) {
      if (!confirm("Delete this product?")) return;
      await api.delete(`/api/products/${id}`);
      showToast("Product deleted");
      loadProducts();
    }

    function openModal(id) {
      document.getElementById(id).classList.remove("hidden");
    }
    function closeModal(id) {
      document.getElementById(id).classList.add("hidden");
      if (id === "productModal") {
        editingProductId = null;
        document.getElementById("productForm").reset();
        document.getElementById("productModalTitle").textContent = "Add Product";
      }
    }

    initApp().then(loadProducts);
  </script>
  <style>
    .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; }
    .modal-content { background:#fff; padding:24px; border-radius:8px; width:100%; max-width:480px; }
    .modal-content label { display:block; font-size:13px; font-weight:500; margin-bottom:4px; margin-top:10px; }
    .modal-content input, .modal-content textarea { margin-bottom:4px; }
  </style>
</body>
</html>
