<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOM - Celestial Grace Inventory</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <aside class="sidebar">
    <h2>Celestial Grace</h2>
    <p>Inventory</p>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/products" data-roles="ADMIN,STAFF">Products</a>
      <a href="/raw-materials" data-roles="ADMIN,STAFF">Raw Materials</a>
      <a href="/suppliers" data-roles="ADMIN">Suppliers</a>
      <a href="/purchase-orders" data-roles="ADMIN">Purchase Orders</a>
      <a href="/customers" data-roles="ADMIN,STAFF">Customers</a>
      <a href="/sales-orders" data-roles="ADMIN,STAFF">Sales Orders</a>
      <a href="/inventory" data-roles="ADMIN,STAFF">Inventory</a>
      <a href="/bom" data-roles="ADMIN">BOM</a>
      <a href="/import" data-roles="ADMIN">Import</a>
      <a href="/admin" data-roles="ADMIN">Admin</a>
    </nav>
    <div style="margin-top:auto; padding-top:16px; border-top:1px solid #e5e7eb;">
      <p style="font-size:13px; font-weight:500;" id="userName"></p>
      <p style="font-size:11px; color:#6b7280;" id="userRole"></p>
      <button class="btn" style="width:100%; margin-top:8px;" onclick="logout()">Logout</button>
    </div>
  </aside>
  <main class="main">
    <div class="top-bar"><h1>Bill of Materials</h1></div>
    <div class="card"><table><thead><tr><th>Variant</th><th>Material</th><th>Qty/Unit</th><th>Unit</th><th>Net Consumption</th></tr></thead>
    <tbody id="bomTable"><tr><td colspan="5" style="text-align:center;color:#6b7280;">Loading...</td></tr></tbody></table></div>
  </main>
  <script src="/js/api.js"></script><script src="/js/app.js"></script>
  <script>
    async function loadBOM() {
      // Load variants and materials to build manual BOM view
      const [products, materials] = await Promise.all([api.get("/api/products"), api.get("/api/raw-materials")]);
      const tbody = document.getElementById("bomTable");
      if (!products || products.length === 0) { tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#6b7280;">No data</td></tr>'; return; }
      const rows = [];
      for (const p of products) {
        for (const v of (p.variants || [])) {
          for (const m of materials.slice(0, 3)) {
            rows.push(`<tr><td>${p.name} / ${v.color}</td><td>${m.name}</td><td>1</td><td>${m.unit}</td><td>-</td></tr>`);
          }
        }
      }
      tbody.innerHTML = rows.join("") || '<tr><td colspan="5" style="text-align:center;color:#6b7280;">No BOM data</td></tr>';
    }
    initApp().then(loadBOM);
  </script>
</body>
</html>
