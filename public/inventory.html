<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory - Celestial Grace Inventory</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <aside class="sidebar">
    <h2>Celestial Grace</h2>
    <p>Inventory</p>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/products" data-roles="ADMIN,STAFF">Products</a>
      <a href="/raw-materials" data-roles="ADMIN,STAFF">Raw Materials</a>
      <a href="/suppliers" data-roles="ADMIN">Suppliers</a>
      <a href="/purchase-orders" data-roles="ADMIN">Purchase Orders</a>
      <a href="/customers" data-roles="ADMIN,STAFF">Customers</a>
      <a href="/sales-orders" data-roles="ADMIN,STAFF">Sales Orders</a>
      <a href="/inventory" data-roles="ADMIN,STAFF">Inventory</a>
      <a href="/bom" data-roles="ADMIN">BOM</a>
      <a href="/import" data-roles="ADMIN">Import</a>
      <a href="/admin" data-roles="ADMIN">Admin</a>
    </nav>
    <div style="margin-top:auto; padding-top:16px; border-top:1px solid #e5e7eb;">
      <p style="font-size:13px; font-weight:500;" id="userName"></p>
      <p style="font-size:11px; color:#6b7280;" id="userRole"></p>
      <button class="btn" style="width:100%; margin-top:8px;" onclick="logout()">Logout</button>
    </div>
  </aside>
  <main class="main">
    <div class="top-bar">
      <h1>Inventory</h1>
      <button class="btn btn-primary" onclick="document.getElementById('moveTab').classList.remove('hidden'); loadMovements();">Movement Log</button>
    </div>
    <div id="stockTab" class="card"><table><thead><tr><th>Product</th><th>Variant</th><th>Qty</th><th>Threshold</th><th>Status</th></tr></thead>
    <tbody id="inventoryTable"><tr><td colspan="5" style="text-align:center;color:#6b7280;">Loading...</td></tr></tbody></table></div>
    <div id="moveTab" class="card hidden" style="margin-top:16px;"><h3>Movements</h3><table><thead><tr><th>Type</th><th>Product</th><th>Variant</th><th>Qty</th><th>Reason</th><th>Date</th></tr></thead>
    <tbody id="movementsTable"><tr><td colspan="6" style="text-align:center;color:#6b7280;">Loading...</td></tr></tbody></table></div>
  </main>
  <script src="/js/api.js"></script><script src="/js/app.js"></script>
  <script>
    async function loadInventory() {
      const data = await api.get("/api/inventory");
      const tbody = document.getElementById("inventoryTable");
      if (!data || data.length === 0) { tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#6b7280;">No inventory</td></tr>'; return; }
      tbody.innerHTML = data.map(i => {
        const low = i.quantity <= i.lowStockThreshold;
        return `<tr style="${low ? "background:#fee2e2;" : ""}"><td>${i.product?.name || "-"}</td><td>${i.variant ? i.variant.color + " / " + i.variant.material : "-"}</td><td>${i.quantity}</td><td>${i.lowStockThreshold}</td><td>${low ? '<span class="badge" style="background:#fee2e2;color:#991b1b;">Low</span>' : '<span class="badge" style="background:#dcfce7;color:#166534;">OK</span>'}</td></tr>`;
      }).join("");
    }
    async function loadMovements() {
      const data = await api.get("/api/movements");
      const tbody = document.getElementById("movementsTable");
      if (!data || data.length === 0) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#6b7280;">No movements</td></tr>'; return; }
      tbody.innerHTML = data.map(m => `<tr><td>${m.type}</td><td>${m.product?.name || "-"}</td><td>${m.variant ? m.variant.color + " / " + m.variant.material : "-"}</td><td>${Number(m.quantity).toFixed(2)}</td><td>${m.reason}</td><td>${new Date(m.createdAt).toLocaleString()}</td></tr>`).join("");
    }
    initApp().then(loadInventory);
  </script>
</body>
</html>
