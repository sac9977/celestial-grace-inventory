<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celestial Grace - Login</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>Celestial Grace Inventory</h1>
      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required />
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:12px;">Sign in</button>
      </form>
      <div id="error" class="error"></div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const res = await api.post("/api/auth/login", { email, password });
      if (res.success) {
        window.location.href = "/";
      } else {
        document.getElementById("error").textContent = res.error || "Invalid credentials";
      }
    });
  </script>
</body>
</html>
