<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suppliers - Celestial Grace Inventory</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <aside class="sidebar">
    <h2>Celestial Grace</h2>
    <p>Inventory</p>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/products" data-roles="ADMIN,STAFF">Products</a>
      <a href="/raw-materials" data-roles="ADMIN,STAFF">Raw Materials</a>
      <a href="/suppliers" data-roles="ADMIN">Suppliers</a>
      <a href="/purchase-orders" data-roles="ADMIN">Purchase Orders</a>
      <a href="/customers" data-roles="ADMIN,STAFF">Customers</a>
      <a href="/sales-orders" data-roles="ADMIN,STAFF">Sales Orders</a>
      <a href="/inventory" data-roles="ADMIN,STAFF">Inventory</a>
      <a href="/bom" data-roles="ADMIN">BOM</a>
      <a href="/import" data-roles="ADMIN">Import</a>
      <a href="/admin" data-roles="ADMIN">Admin</a>
    </nav>
    <div style="margin-top:auto; padding-top:16px; border-top:1px solid #e5e7eb;">
      <p style="font-size:13px; font-weight:500;" id="userName"></p>
      <p style="font-size:11px; color:#6b7280;" id="userRole"></p>
      <button class="btn" style="width:100%; margin-top:8px;" onclick="logout()">Logout</button>
    </div>
  </aside>
  <main class="main">
    <div class="top-bar">
      <h1>Suppliers</h1>
      <button class="btn btn-primary" onclick="openModal('supplierModal')">Add Supplier</button>
    </div>
    <div class="card">
      <table>
        <thead>
          <tr><th>Name</th><th>Contact</th><th>Email</th><th>Phone</th><th>Actions</th></tr>
        </thead>
        <tbody id="suppliersTable">
          <tr><td colspan="5" style="text-align:center;color:#6b7280;">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <div id="supplierModal" class="modal">
    <div class="modal-content">
      <h3 id="supplierModalTitle">Add Supplier</h3>
      <form id="supplierForm">
        <input type="hidden" id="supplierId" />
        <label>Name</label>
        <input id="supplierName" required />
        <label>Contact</label>
        <input id="supplierContact" />
        <label>Email</label>
        <input id="supplierEmail" type="email" />
        <label>Phone</label>
        <input id="supplierPhone" />
        <label>Address</label>
        <textarea id="supplierAddress"></textarea>
        <div style="display:flex; gap:8px; margin-top:12px;">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn" onclick="closeModal('supplierModal')">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    let editingSupplierId = null;

    async function loadSuppliers() {
      const data = await api.get("/api/suppliers");
      const tbody = document.getElementById("suppliersTable");
      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#6b7280;">No suppliers found</td></tr>';
        return;
      }
      tbody.innerHTML = data.map(s => `<tr>
        <td>${s.name}</td>
        <td>${s.contact || "-"}</td>
        <td>${s.email || "-"}</td>
        <td>${s.phone || "-"}</td>
        <td>
          <button class="btn" onclick="editSupplier('${s.id}')">Edit</button>
          <button class="btn btn-danger" onclick="deleteSupplier('${s.id}')">Delete</button>
        </td>
      </tr>`).join("");
    }

    document.getElementById("supplierForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        name: document.getElementById("supplierName").value,
        contact: document.getElementById("supplierContact").value,
        email: document.getElementById("supplierEmail").value,
        phone: document.getElementById("supplierPhone").value,
        address: document.getElementById("supplierAddress").value,
      };
      if (editingSupplierId) {
        await api.patch(`/api/suppliers/${editingSupplierId}`, payload);
        showToast("Supplier updated");
      } else {
        await api.post("/api/suppliers", payload);
        showToast("Supplier created");
      }
      closeModal("supplierModal");
      loadSuppliers();
    });

    async function editSupplier(id) {
      const s = await api.get(`/api/suppliers/${id}`);
      editingSupplierId = id;
      document.getElementById("supplierModalTitle").textContent = "Edit Supplier";
      document.getElementById("supplierName").value = s.name;
      document.getElementById("supplierContact").value = s.contact || "";
      document.getElementById("supplierEmail").value = s.email || "";
      document.getElementById("supplierPhone").value = s.phone || "";
      document.getElementById("supplierAddress").value = s.address || "";
      openModal("supplierModal");
    }

    async function deleteSupplier(id) {
      if (!confirm("Delete this supplier?")) return;
      await api.delete(`/api/suppliers/${id}`);
      showToast("Supplier deleted");
      loadSuppliers();
    }

    function openModal(id) {
      document.getElementById(id).classList.remove("hidden");
    }

    function closeModal(id) {
      document.getElementById(id).classList.add("hidden");
      if (id === "supplierModal") {
        editingSupplierId = null;
        document.getElementById("supplierForm").reset();
        document.getElementById("supplierModalTitle").textContent = "Add Supplier";
      }
    }

    initApp().then(loadSuppliers);
  </script>
  <style>
    .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; }
    .modal-content { background:#fff; padding:24px; border-radius:8px; width:100%; max-width:480px; }
    .modal-content label { display:block; font-size:13px; font-weight:500; margin-bottom:4px; margin-top:10px; }
    .modal-content input, .modal-content textarea { margin-bottom:4px; }
  </style>
</body>
</html>
